<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar site — AppSites</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="editor">
    <div>
      <header class="topbar">
        <a class="btn btn-sm" href="/#/sites" title="Voltar para meus sites">← <span class="hide-sm">Sites</span></a>
        <input class="title-input" id="title" aria-label="Nome do site" maxlength="120">
        <span class="save-state hide-sm" id="save-state" aria-live="polite"></span>
        <div class="spacer"></div>
        <select class="input input-sm hide-sm" id="model" aria-label="Modelo" style="max-width:200px"></select>
        <div class="group hide-sm" role="group" aria-label="Tamanho da tela">
          <button class="btn btn-icon btn-sm active" data-device="desktop" title="Computador">🖥</button>
          <button class="btn btn-icon btn-sm" data-device="mobile" title="Celular">📱</button>
        </div>
        <button class="btn btn-sm" id="ai" title="Reescrever textos com IA">✨ IA</button>
        <a class="btn btn-sm" id="view" target="_blank" rel="noopener">Ver ↗</a>
        <button class="btn btn-sm" id="publish"></button>
        <button class="btn btn-sm" id="vercel">▲ Vercel</button>
        <button class="btn btn-primary btn-sm" id="save">Salvar</button>
      </header>
      <nav class="mobile-tabs" aria-label="Seções do editor">
        <button class="tab active" data-show="left">Dados</button>
        <button class="tab" data-show="canvas">Prévia</button>
      </nav>
    </div>
    <div class="editor-main editor-main-2">
      <aside class="sidebar show" id="left" style="width:auto">
        <div class="panel" id="form"></div>
      </aside>
      <section class="canvas-wrap" id="canvas-wrap">
        <div class="canvas" id="canvas"><iframe id="frame" title="Pré-visualização do site"></iframe></div>
      </section>
    </div>
  </div>
  <script src="/js/ui.js"></script>
  <script src="/js/site-editor.js"></script>
</body>
</html>
